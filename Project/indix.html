<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaussian Elimination Solver</title>
  <link rel="stylesheet" href="Style/Style.css" />
</head>
<body bgcolor="white">
  <div class="Container">
    <h1>This web is used to solve linear systems by Gaussian elimination</h1>
    
    <div class="Controls">
      <label>
        Enter number of equations: 
        <input id="n" type="number" max="8" min="1" value="2">
      </label>
      <button id="build">Build Matrix</button>
      <button id="solve">Solve</button>
      <button id="clear">Clear</button>
    </div>

    <div class="Matrix">
      <div class="AgumentedTitle">The augmented matrix (A | b)</div>
      <div class="MatrixArea">
        <table id="MatrixTable"></table>
      </div>
    </div>

    <div class="Output" id="Output">
      <div class="Area">The steps will appear here after clicking Solve.</div>
    </div>
  </div>

  <script src="Script/gaussian.js"></script>
</body>
</html>
